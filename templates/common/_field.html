<div class="field-group{% if field.errors %} field-group--error{% endif %}{% if field_class %} {{ field_class }}{% endif %}">
    {% if not hide_label %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% endif %}

    {{ field }}

    {% if field.help_text %}
    <div class="field-hint">{{ field.help_text|safe }}</div>
    {% endif %}

    {% for error in field.errors %}
    <p class="field-error">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        <span>{{ error }}</span>
    </p>
    {% endfor %}
</div>
